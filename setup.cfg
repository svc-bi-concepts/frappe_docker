# Config file for isort, codespell and other Python projects.
# In this case it is not used for packaging.

[isort]
profile = black
known_third_party = frappe

[codespell]
skip = images/bench/Dockerfile
# erpnextswiss's own comment ('for compatiblity') in its salary_certificate.py, copied whole into test_build_image.py
# so the patches apply to the pinned text; the copy must stay byte for byte
ignore-words-list = compatiblity

[tool:pytest]
addopts = -s --exitfirst
