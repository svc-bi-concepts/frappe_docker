repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # finance/patches/*.patch carry unified diffs whose context must byte-match upstream
      # sources: a stripped trailing space in a hunk makes git apply fail at the image build.
      - id: trailing-whitespace
        exclude: ^finance/patches/.*\.patch$
      - id: end-of-file-fixer
        exclude: ^finance/patches/.*\.patch$

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      # The av-inject launchers (finance/bexio/*.py, finance/sharepoint/sp_read.py) are bash
      # files; the .py name is the av job's convention (erp-tkfq). They are not python, so the
      # python tools cannot run on them: black parsed the exec line as a python expression and
      # rewrote it (/ usr / bin), breaking the launchers. Same principle as the patch excludes
      # above: the content's language decides, not the extension.
      - id: pyupgrade
        args: [--py37-plus]
        exclude: ^finance/(bexio/(create_contact_and_bill|export|inventory|login_helper|oauth|upload_bill)|sharepoint/sp_read)\.py$

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        exclude: ^finance/(bexio/(create_contact_and_bill|export|inventory|login_helper|oauth|upload_bill)|sharepoint/sp_read)\.py$

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        exclude: ^finance/(bexio/(create_contact_and_bill|export|inventory|login_helper|oauth|upload_bill)|sharepoint/sp_read)\.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        exclude: ^docs/pnpm-lock\.yaml$
        additional_dependencies:
          - prettier@3.9.9

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^docs/pnpm-lock\.yaml$
        args:
          - -L
          # Words codespell flags that are correct here, each with the reason:
          #   ro - upstream's own entry (Swiss postfinance QR-bill strings, kept)
          #   oder, ist, offen, sie - German words ("or", "is", "open", "it") in
          #     user-facing MwSt/report strings and German docs prose
          #   januar, februar, juni, juli, oktober, dezember - German month names
          #     in cash_forecast's month keys, its tests and the docs
          #   Referenz, Adresse, Periode - German QR-bill/payroll labels ("reference",
          #     "address", "period") rendered to users
          #   Informations - French QR-bill label ("Informations supplémentaires")
          #   Automic - Broadcom Automic Automation, the vault system's product name
          #   BU - Swiss occupational-accident insurance share (Betriebsunfall),
          #        the UVG employer-share label's term (BU vs NBU)
          #   positiv, negativ - German for positive/negative: erpnextswiss's own
          #     variable names at the pin, quoted in patch context and pin excerpts
          - >-
            ro,oder,ist,offen,sie,januar,februar,juni,juli,oktober,dezember,
            Referenz,Adresse,Periode,Informations,Automic,BU,positiv,negativ

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        language: golang
        additional_dependencies: [mvdan.cc/sh/v3/cmd/shfmt@latest]
        entry: shfmt
        args: [-w]
        types: [shell]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint
        description: Lint Dockerfiles and Containerfiles with Hadolint
        language: docker_image
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
        types: [dockerfile]

      - id: validate-compose
        name: validate compose configurations
        description: Validate every supported Docker Compose override combination
        language: system
        entry: python .github/scripts/validate_compose.py
        pass_filenames: false
        files: >-
          (?x)^(
            compose\.yaml|
            example\.env|
            overrides/compose\..*\.yaml|
            tests/compose-configs\.json|
            \.github/scripts/validate_compose\.py
          )$
