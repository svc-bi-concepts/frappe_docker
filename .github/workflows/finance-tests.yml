# GitHub CI for the finance stack: the host part of the yard's merge gate
# (.yardr/check), which needs no private/ data and no custom image. Both this
# workflow and .yardr/check call .yardr/check-host.sh, so the compose checks
# and the test-module lists exist once and cannot drift apart.
#
# Not here on purpose: the frappe-image docker run line (needs the custom image,
# built locally on the yard's machine) and pre-commit (upstream's lint workflow
# does that). Upstream's own workflows stay untouched.
name: finance tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The only non-stdlib package any host test module needs: test_payslip's render.
      - name: Install jinja2
        run: python -m pip install jinja2

      - name: Run the finance host tests
        run: sh .yardr/check-host.sh
