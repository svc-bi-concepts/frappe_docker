# Finance copy stack: a copy of the live books on a train image, for the HR train's tests (finance/docs/hrms.md,
# 'Copy stack for the HR train'). Run it only through finance/scripts/copy-stack.sh, which sets the project name
# and COPY_IMAGE. Never with -p frappe-finance: that is the live stack.
#   docker compose -p frappe-finance-copy -f pwd.yml -f finance-copy.yml up -d --scale scheduler=0
# It is started on demand, so no service restarts by itself (restart: "no" overrides pwd.yml's unless-stopped).
# Its own volumes and network come from the project name. frontend listens on 127.0.0.1:8815 only, and nothing
# is on the tailnet until the yardmaster serves it. The live stack keeps finance-local.yml.
# No secrets here: the copy's admin password is set on the site and kept in private/.
services:
  frontend:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
    restart: "no"
    ports: !override
      - "127.0.0.1:8815:8080"
  backend:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
    restart: "no"
  configurator:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
  create-site:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
  queue-long:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
    restart: "no"
  queue-short:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
    restart: "no"
  scheduler:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
    restart: "no"
  websocket:
    image: ${COPY_IMAGE:-frappe-finance-custom:copy-not-set}
    restart: "no"
  db:
    restart: "no"
  redis-queue:
    restart: "no"
  redis-cache:
    restart: "no"
